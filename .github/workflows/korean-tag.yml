# 한글판 버전 태그: main에서 korean/upstream.json의 원본 버전이 바뀌면
# korean-v<원본버전> 태그를 붙인다 (예: 원본 v1.0.5 → korean-v1.0.5).
# 원본 배포 워크플로가 반응하는 v* 태그와 겹치지 않도록 korean- 접두사를 쓴다.
# GITHUB_TOKEN으로 push한 태그는 다른 워크플로를 트리거하지 않으므로, 새 태그를
# 만들면 Windows 설치 파일(korean-windows.yml)과 macOS DMG(korean-macos.yml) 빌드를
# 직접 실행한다. 두 빌드가 각자 초안 릴리스를 만들어 겹치지 않도록 초안은 여기서 먼저 만든다.
name: Korean version tag

on:
  push:
    branches: [main]
    paths: [korean/upstream.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the Korean build of this upstream version
        id: tag
        run: |
          upstream=$(jq -r .tag korean/upstream.json)
          tag="korean-$upstream"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "created $tag"
          echo "created=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release for the new tag
        if: steps.tag.outputs.created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.created }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Buzz Korean ${TAG#korean-v}" --notes "Buzz 한글판 ${TAG#korean-v}"
          fi
      # Windows is built but kept off the release until Claude and Codex run there.
      - name: Build the Windows installer for the new tag
        if: steps.tag.outputs.created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.created }}
        run: gh workflow run korean-windows.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG" -f release=false
      - name: Build the macOS DMG for the new tag
        if: steps.tag.outputs.created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.created }}
        run: gh workflow run korean-macos.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG" -f release=true
