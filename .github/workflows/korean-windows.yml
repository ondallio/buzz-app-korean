# 한글판 Windows x64 설치 파일(NSIS, 서명 없음)을 빌드해 릴리스에 첨부한다.
# 원본 desktop-build.yml의 windows 작업을 따르되, 한글판 macOS DMG와 같은 정책을 쓴다:
# - scripts/korean/build-windows.mjs가 오버레이(Buzz Korean, ai.codepair.buzz-korean,
#   buzz-ai.codepair.buzz-korean 스킴, 업데이터 off)와 BUZZ_DISTRIBUTION_ID를 넣는다.
# - 업데이터·서명·FI(로그인 서버)·키 백업 서비스 변수와 비밀은 쓰지 않는다.
# - 설치 시 사용자 PATH를 건드리지 않는다(korean/windows/installer-hooks.nsh).
#
# 트리거: 사람이 push한 korean-v* 태그, 또는 수동 실행(태그 지정).
# korean-tag.yml이 GITHUB_TOKEN으로 만든 태그 push는 워크플로를 트리거하지 않으므로
# korean-tag.yml이 태그를 만든 뒤 이 워크플로를 workflow_dispatch로 직접 호출한다.
name: Korean Windows installer

on:
  push:
    tags: ["korean-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "빌드할 한글판 태그 (예: korean-v1.0.5)"
        required: true
        type: string
      release:
        description: "릴리스에 설치 파일 첨부"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: korean-windows-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer (unsigned)
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      UPLOAD: ${{ inputs.release == true }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^korean-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a Korean release tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # Hermit은 Windows에서 돌지 않으므로 bin/의 핀을 읽어 같은 버전을 쓴다.
      - name: Read repository tool pins
        id: pins
        shell: pwsh
        run: |
          foreach ($tool in @('node', 'pnpm')) {
            $pins = @(Get-ChildItem "bin/.$tool-*.pkg")
            if ($pins.Count -ne 1) { throw "Expected one $tool pin" }
            $version = $pins[0].Name -replace "^\.$tool-(.*)\.pkg$", '$1'
            "$tool=$version" >> $env:GITHUB_OUTPUT
          }
          $rust = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"$').Matches.Groups[1].Value
          if (!$rust) { throw "Expected a rust-toolchain.toml channel" }
          "rust=$rust" >> $env:GITHUB_OUTPUT
      - name: Select pinned Rust
        shell: pwsh
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$env:RUST_VERSION" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: korean-windows-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        id: build
        run: node scripts/korean/build-windows.mjs
      - name: Check the tag matches the app version
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if [[ "$TAG" != "korean-v$VERSION" ]]; then
            echo "::error::$TAG does not match app version $VERSION (korean/upstream.json)"
            exit 1
          fi
      - name: Install into disposable runner and verify
        shell: pwsh
        env:
          INSTALLER: ${{ steps.build.outputs.installer }}
          IDENTIFIER: ${{ steps.build.outputs.identifier }}
          SCHEME: ${{ steps.build.outputs.scheme }}
        run: |
          $before = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $destination = "$env:RUNNER_TEMP\Buzz Korean install"
          # NSIS /D must be last and unquoted, including paths containing spaces.
          $process = Start-Process $env:INSTALLER -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          Get-ChildItem $destination | Format-Table Name, Length
          # Tauri keeps Cargo's binary name (Buzz.exe); productName names the
          # install folder, shortcuts and installer instead.
          $app = "$destination\Buzz.exe"
          foreach ($file in @($app, "$destination\bin\buzz.exe", "$destination\bin\goose-acp.exe", "$destination\bin\buzz-agent-command.exe")) {
            if (!(Test-Path $file)) { throw "Missing $file" }
          }
          & "$destination\bin\buzz.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'buzz.exe --help failed' }
          # The Korean hooks never edit PATH: official Buzz keeps its `buzz`.
          $after = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($after -ne $before) { throw "Installer changed the user PATH: $after" }
          if ($after -like "*$destination*") { throw 'Install folder is on the user PATH' }
          # Only the Korean scheme is registered, and it opens this install.
          $command = (Get-Item "HKCU:\Software\Classes\$env:SCHEME\shell\open\command").GetValue('')
          if ($command -notlike "*$app*") { throw "Unexpected $env:SCHEME handler: $command" }
          $official = Get-Item 'HKCU:\Software\Classes\buzz\shell\open\command' -ErrorAction SilentlyContinue
          if ($official -and $official.GetValue('') -like "*$destination*") { throw 'Installer claimed buzz://' }
          # The native build carries the Korean distribution ID, not the updater.
          $binary = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($app))
          if (!$binary.Contains("$env:IDENTIFIER.identity")) { throw 'App lacks the Korean credential namespace' }
          if ($binary.Contains('releases/download/stable-feed') -or $binary.Contains('releases/download/preview-feed')) { throw 'App embeds an updater feed' }
          "Verified $app"
      - name: Stage installer and checksum
        id: stage
        env:
          INSTALLER: ${{ steps.build.outputs.installer }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          mkdir release-assets
          cp "$INSTALLER" "release-assets/$ASSET"
          cd release-assets
          sha256sum "$ASSET" | tee "$ASSET.sha256"
          {
            echo "### $ASSET"
            echo '```'
            cat "$ASSET.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: korean-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      # 릴리스가 없으면 초안으로 만든다: 공개는 사람이 확인한 뒤 한다.
      - name: Attach to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Buzz Korean ${TAG#korean-v}" --notes "Buzz 한글판 ${TAG#korean-v}"
          fi
          gh release upload "$TAG" "release-assets/$ASSET" "release-assets/$ASSET.sha256" --clobber
